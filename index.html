<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dashboard Sektor Pembelajaran</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #edf4ff;
      background:
        radial-gradient(
          ellipse at 85% 15%,
          #087bb533,
          transparent 50%
        ),
        radial-gradient(
          ellipse at 10% 90%,
          #ec32ba26,
          transparent 50%
        ),
        #050914;
    }

    main {
      width: 100%;
      max-width: 620px;
      padding: 38px 26px;
      text-align: center;
      border: 1px solid #365772;
      border-top: 3px solid #ec32ba;
      border-radius: 20px;
      background: #0b1528;
      box-shadow: 0 0 35px #ec32ba18;
    }

    .label {
      color: #36dcff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1.8;
    }

    h1 {
      margin: 20px 0;
      color: #f4d384;
      font-size: clamp(24px, 5vw, 34px);
      line-height: 1.3;
    }

    p {
      color: #b6c7de;
      font-size: 14px;
      line-height: 1.8;
    }

    .gold {
      display: inline-block;
      margin-top: 18px;
      padding: 15px 28px;
      border: 1px solid #ffe8ad;
      border-radius: 10px;
      background: linear-gradient(
        125deg,
        #aa792b,
        #f8dfa0 48%,
        #c89235
      );
      color: #251a09;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 0 18px #eabd4430;
    }

    .gold:hover {
      box-shadow:
        0 0 12px #ec32ba,
        0 0 28px #ec32ba66;
    }

    .gold:focus-visible {
      outline: 3px solid #36dcff;
      outline-offset: 5px;
    }
  </style>
</head>

<body>
  <main>
    <div class="label">
      PEJABAT PENDIDIKAN DAERAH HULU SELANGOR
    </div>

    <h1>PROGRAM SEKTOR PEMBELAJARAN</h1>

    <p role="status">
      Anda sedang dibawa ke dashboard.
      Jika halaman tidak bertukar, klik butang di bawah.
    </p>

    <a
      class="gold"
      id="bukaDashboard"
      href="https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbwo_MP3Ed00I48QbbMTIG5u4_paHbL-paEz2Yet-NwmlSFl1jmXrCzw5sz2SbuYSFU/exec">
      Buka Dashboard
    </a>
  </main>

  <script>
    window.setTimeout(function() {
      const pautan =
        document.getElementById('bukaDashboard').href;

      window.location.replace(pautan);
    }, 1500);
  </script>
</body>
</html>
